name: CMake Build

on:
  push:
    branches:
      - '**'

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          files=$(find src tests -type f \( -name "*.cpp" -o -name "*.hpp" \) -exec clang-format --dry-run --Werror {} + 2>&1 | tee /dev/stderr)
          if [ -n "$files" ]; then
            echo "Some files are not formatted correctly."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake make g++ libyaml-cpp-dev libboost-all-dev

      - name: Download Eigen source
        run: wget -O source.tar.gz "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz"

      - name: Create eigen3 directory
        run: mkdir eigen3

      - name: Extract Eigen source
        run: tar -xzvf source.tar.gz -C eigen3

      - name: Create build directory
        run: mkdir build

      - name: Run CMake
        run: cmake -DEIGEN3_INCLUDE_DIR=/home/runner/work/testing-boost-exercise/testing-boost-exercise/eigen3/eigen-3.4.0 ..
        working-directory: build

      - name: Build project
        run: make -j
        working-directory: build

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: testsidemade-exe
          path: build/testsidemade
          retention-days: 1
  
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create build directory
        run: mkdir build

      - name: Copy testconfig.yml
        run: cp tests/testconfig.yml build/testconfig.yml
        
      - name: Download test executable
        uses: actions/download-artifact@v4
        with:
          name: testsidemade-exe
          path: build

      - name: Change test executable permission
        run: chmod +x testsidemade

      - name: Install libraries
        run: sudo apt-get install libboost-all-dev libyaml-cpp-dev 

      - name: Run test executable
        run: ./testsidemade
        working-directory: build


        



  
